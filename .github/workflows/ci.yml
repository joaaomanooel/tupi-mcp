name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'
  release:
    types:
      - published
      - edited

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      release_notes_retry: ${{ steps.release_notes_retry.outputs.retry }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Require release notes
        if: github.event_name == 'release'
        env:
          RELEASE_NOTES: ${{ github.event.release.body }}
        run: |
          if [[ -z "$(printf '%s' "$RELEASE_NOTES" | tr -d '[:space:]')" ]]; then
            printf 'Published releases must include release notes.\n' >&2
            exit 1
          fi
      - name: Detect release notes repair
        id: release_notes_retry
        if: github.event_name == 'release' && github.event.action == 'edited'
        env:
          RELEASE_BODY_CHANGED: ${{ toJSON(github.event.changes.body) != 'null' }}
          PREVIOUS_RELEASE_NOTES: ${{ github.event.changes.body.from }}
        run: |
          if [[ "$RELEASE_BODY_CHANGED" == 'true' ]] && [[ -z "$(printf '%s' "$PREVIOUS_RELEASE_NOTES" | tr -d '[:space:]')" ]]; then
            printf 'retry=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'retry=false\n' >> "$GITHUB_OUTPUT"
          fi
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            printf 'Release tag must use vMAJOR.MINOR.PATCH: %s\n' "$RELEASE_TAG" >&2
            exit 1
          fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - name: Scan repository history for secrets
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks"
          GOBIN="$RUNNER_TEMP/gitleaks" go install github.com/zricethezav/gitleaks/v8@v8.30.1
          "$RUNNER_TEMP/gitleaks/gitleaks" git --redact --no-banner --log-opts=--all
      - name: Require release commit on main
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          if ! git merge-base --is-ancestor "$RELEASE_COMMIT" origin/main; then
            printf 'Release tag must point to a commit contained in main.\n' >&2
            exit 1
          fi
      - run: go test ./...
      - run: go vet ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  image:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
          - platform: linux/arm64
            arch: arm64
          - platform: linux/arm/v7
            arch: armv7
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          tags: local/tupi-mcp:ci-${{ matrix.arch }}
      - uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439
        with:
          image: local/tupi-mcp:ci-${{ matrix.arch }}
          output-format: table
          fail-build: true
          severity-cutoff: high
          grype-version: v0.102.0

  publish:
    if: >-
      github.event_name == 'release' &&
      (github.event.action == 'published' ||
      needs.verify.outputs.release_notes_retry == 'true') &&
      !github.event.release.prerelease
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        id: meta
        with:
          images: ghcr.io/joaaomanooel/tupi-mcp
          tags: |
            type=ref,event=tag
      - name: Build amd64 image by digest
        id: build_amd64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          platforms: linux/amd64
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=ghcr.io/joaaomanooel/tupi-mcp,push-by-digest=true,name-canonical=true,push=true
      - name: Scan amd64 image
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439
        env:
          GRYPE_PLATFORM: linux/amd64
        with:
          image: registry:ghcr.io/joaaomanooel/tupi-mcp@${{ steps.build_amd64.outputs.digest }}
          output-format: table
          fail-build: true
          severity-cutoff: high
          grype-version: v0.102.0
      - name: Build arm64 image by digest
        id: build_arm64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          platforms: linux/arm64
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=ghcr.io/joaaomanooel/tupi-mcp,push-by-digest=true,name-canonical=true,push=true
      - name: Scan arm64 image
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439
        env:
          GRYPE_PLATFORM: linux/arm64
        with:
          image: registry:ghcr.io/joaaomanooel/tupi-mcp@${{ steps.build_arm64.outputs.digest }}
          output-format: table
          fail-build: true
          severity-cutoff: high
          grype-version: v0.102.0
      - name: Build armv7 image by digest
        id: build_armv7
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          platforms: linux/arm/v7
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=ghcr.io/joaaomanooel/tupi-mcp,push-by-digest=true,name-canonical=true,push=true
      - name: Scan armv7 image
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439
        env:
          GRYPE_PLATFORM: linux/arm/v7
        with:
          image: registry:ghcr.io/joaaomanooel/tupi-mcp@${{ steps.build_armv7.outputs.digest }}
          output-format: table
          fail-build: true
          severity-cutoff: high
          grype-version: v0.102.0
      - name: Publish multiarch manifest from scanned digests
        env:
          IMAGE_NAME: ghcr.io/joaaomanooel/tupi-mcp
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          AMD64_DIGEST: ${{ steps.build_amd64.outputs.digest }}
          ARM64_DIGEST: ${{ steps.build_arm64.outputs.digest }}
          ARMV7_DIGEST: ${{ steps.build_armv7.outputs.digest }}
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE_NAME:$RELEASE_TAG" \
            "$IMAGE_NAME@$AMD64_DIGEST" \
            "$IMAGE_NAME@$ARM64_DIGEST" \
            "$IMAGE_NAME@$ARMV7_DIGEST"
      - name: Report published manifest
        env:
          IMAGE_NAME: ghcr.io/joaaomanooel/tupi-mcp
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: docker buildx imagetools inspect "$IMAGE_NAME:$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
