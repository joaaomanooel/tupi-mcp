name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - run: go vet ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

  image:
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
          - platform: linux/arm64
            arch: arm64
          - platform: linux/arm/v7
            arch: armv7
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          tags: local/tupi-mcp:ci-${{ matrix.arch }}
      - uses: anchore/scan-action@568b89d27fc18c60e56937bff480c91c772cd993
        with:
          image: local/tupi-mcp:ci-${{ matrix.arch }}
          fail-build: true
          severity-cutoff: high
          grype-version: v0.102.0

  publish:
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        id: meta
        with:
          images: ghcr.io/joaaomanooel/tupi-mcp
          tags: |
            type=sha,format=long
            type=ref,event=tag
      - name: Build amd64 candidate
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: ghcr.io/joaaomanooel/tupi-mcp:candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-amd64
          labels: ${{ steps.meta.outputs.labels }}
      - name: Scan amd64 candidate
        uses: anchore/scan-action@568b89d27fc18c60e56937bff480c91c772cd993
        with:
          image: docker:ghcr.io/joaaomanooel/tupi-mcp:candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-amd64
          fail-build: true
          severity-cutoff: high
          grype-version: v0.102.0
      - name: Push scanned amd64 candidate
        id: push_amd64
        env:
          CANDIDATE_IMAGE: ghcr.io/joaaomanooel/tupi-mcp:candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-amd64
        run: |
          digest="$(docker push --quiet "$CANDIDATE_IMAGE")"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            printf 'Unexpected push digest: %s\n' "$digest" >&2
            exit 1
          fi
          printf 'image=%s@%s\n' "${CANDIDATE_IMAGE%:*}" "$digest" >> "$GITHUB_OUTPUT"
      - name: Build arm64 candidate
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          platforms: linux/arm64
          load: true
          push: false
          tags: ghcr.io/joaaomanooel/tupi-mcp:candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-arm64
          labels: ${{ steps.meta.outputs.labels }}
      - name: Scan arm64 candidate
        uses: anchore/scan-action@568b89d27fc18c60e56937bff480c91c772cd993
        with:
          image: docker:ghcr.io/joaaomanooel/tupi-mcp:candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-arm64
          fail-build: true
          severity-cutoff: high
          grype-version: v0.102.0
      - name: Push scanned arm64 candidate
        id: push_arm64
        env:
          CANDIDATE_IMAGE: ghcr.io/joaaomanooel/tupi-mcp:candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-arm64
        run: |
          digest="$(docker push --quiet "$CANDIDATE_IMAGE")"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            printf 'Unexpected push digest: %s\n' "$digest" >&2
            exit 1
          fi
          printf 'image=%s@%s\n' "${CANDIDATE_IMAGE%:*}" "$digest" >> "$GITHUB_OUTPUT"
      - name: Build armv7 candidate
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          platforms: linux/arm/v7
          load: true
          push: false
          tags: ghcr.io/joaaomanooel/tupi-mcp:candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-armv7
          labels: ${{ steps.meta.outputs.labels }}
      - name: Scan armv7 candidate
        uses: anchore/scan-action@568b89d27fc18c60e56937bff480c91c772cd993
        with:
          image: docker:ghcr.io/joaaomanooel/tupi-mcp:candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-armv7
          fail-build: true
          severity-cutoff: high
          grype-version: v0.102.0
      - name: Push scanned armv7 candidate
        id: push_armv7
        env:
          CANDIDATE_IMAGE: ghcr.io/joaaomanooel/tupi-mcp:candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-armv7
        run: |
          digest="$(docker push --quiet "$CANDIDATE_IMAGE")"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            printf 'Unexpected push digest: %s\n' "$digest" >&2
            exit 1
          fi
          printf 'image=%s@%s\n' "${CANDIDATE_IMAGE%:*}" "$digest" >> "$GITHUB_OUTPUT"
      - name: Publish manifest from scanned candidates
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          AMD64_IMAGE: ${{ steps.push_amd64.outputs.image }}
          ARM64_IMAGE: ${{ steps.push_arm64.outputs.image }}
          ARMV7_IMAGE: ${{ steps.push_armv7.outputs.image }}
        run: |
          args=()
          while IFS= read -r tag; do
            args+=(--tag "$tag")
          done <<< "$IMAGE_TAGS"
          docker buildx imagetools create "${args[@]}" \
            "$AMD64_IMAGE" \
            "$ARM64_IMAGE" \
            "$ARMV7_IMAGE"
      - name: Report published manifest
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: docker buildx imagetools inspect "${IMAGE_TAGS%%$'\n'*}" >> "$GITHUB_STEP_SUMMARY"
